<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Agropecuario</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <!-- Lado izquierdo: Panel de Imagen -->
        <div class="login-side-image"></div>
        
        <!-- Lado derecho: Formulario de Login -->
        <div class="login-form-container">
            <div class="login-card">
                <!-- Logo Centrado -->
                <img src="/assets/logo/paafekuto.png" alt="Paafekuto Logo" class="logo-img">
                
                <h1>🌾 Sistema Agropecuario</h1>
                <h2>Registro Único Nacional de Productores</h2>
                
                <% if (error) { %>
                    <div class="error-box">
                        <%= error %>
                    </div>
                <% } %>
                
                <form action="/login" method="POST">
                    <div class="form-group">
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" name="username" placeholder="Ingrese su usuario..." required autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña..." required>
                    </div>
                    
                    <button type="submit" class="btn-submit">🔑 Iniciar Sesión</button>
                </form>
                
                <div class="helper-text">
                    <strong>Credenciales de Prueba:</strong><br>
                    Administrador: <code>admin</code> / <code>admin123</code><br>
                    Revisor Regular: <code>user</code> / <code>user123</code>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
